name: Build NGOC SI MUSIC YouTube Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/youtube-player-reliability-preview

concurrency:
  group: youtube-player-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Run Android lint
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: gradle :app:lintDebug -PyoutubePreview=true --no-daemon

      - name: Run unit tests
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: gradle :app:testDebugUnitTest -PyoutubePreview=true --no-daemon

      - name: Assemble isolated YouTube Preview APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: gradle :app:assembleDebug -PyoutubePreview=true --no-daemon

      - name: Verify preview package identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.ngocsi.music.youtubepreview' versionCode='58' versionName='5.38-youtube-preview'"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          {
            echo "## YouTube Preview APK"
            echo ""
            echo "- Package: `com.ngocsi.music.youtubepreview`"
            echo "- Version: `5.38-youtube-preview`"
            echo "- Build type: debug; separate from production package"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview APK
        uses: actions/upload-artifact@v6
        with:
          name: NGOC_SI_MUSIC_YOUTUBE_PREVIEW_APK
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
