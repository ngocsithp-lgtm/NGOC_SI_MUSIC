name: Build NGOC SI MUSIC 5.1 PRO Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ngoc-si-music-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Lint Debug
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: gradle :app:lintDebug --no-daemon

      - name: Build PRO APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Generate APK SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NGOC_SI_MUSIC_5.1_PRO_DEBUG_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
