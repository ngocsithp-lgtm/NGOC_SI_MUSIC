name: Build NGOC SI MUSIC 5.7 PRO Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ngoc-si-music-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Lint Debug
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: gradle :app:lintDebug --no-daemon
      - name: Build PRO APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Print APK signing certificate (OAuth diagnostic)
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          echo "Package: com.ngocsi.music"
          echo "=== Gradle signingReport ==="
          gradle :app:signingReport --no-daemon 2>&1 | tee "$OUT/signing-report.txt"
          echo "=== SHA-1 from signingReport ==="
          grep -Ei "SHA1:|SHA-1:" "$OUT/signing-report.txt" || true
          {
            echo "## Android OAuth diagnostic"
            echo ""
            echo "- Package: com.ngocsi.music"
            echo ""
            echo "---"
            grep -Ei "Variant: debug|Config: debug|Store:|Alias:|SHA1:|SHA-1:" "$OUT/signing-report.txt" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate APK SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGOC_SI_MUSIC_5.7_PRO_DEBUG_APK
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-keytool-cert.txt
            app/build/outputs/apk/debug/debug-keystore.txt
      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ngoc-si-music-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG"             app/build/outputs/apk/debug/app-debug.apk             app/build/outputs/apk/debug/app-debug.apk.sha256             --title "NGỌC SĨ MUSIC 5.7 PRO — Latest APK"             --notes "Latest successful debug APK built from commit ${{ github.sha }}."
