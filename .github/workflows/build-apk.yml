name: Build NGOC SI MUSIC 5.33 PRO APKs
# CI verification trigger: build and verify the current main branch.
# Final UI polish CI verification.
# Runner reset after UI verification.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ngoc-si-music-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore stable CI signing keystore (required)
        env:
          NGOCSI_KEYSTORE_BASE64: ${{ secrets.NGOCSI_KEYSTORE_BASE64 }}
          NGOCSI_KEYSTORE_PASSWORD: ${{ secrets.NGOCSI_KEYSTORE_PASSWORD }}
          NGOCSI_KEY_ALIAS: ${{ secrets.NGOCSI_KEY_ALIAS }}
          NGOCSI_KEY_PASSWORD: ${{ secrets.NGOCSI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NGOCSI_KEYSTORE_BASE64:-}" ] || [ -z "${NGOCSI_KEYSTORE_PASSWORD:-}" ] || [ -z "${NGOCSI_KEY_ALIAS:-}" ] || [ -z "${NGOCSI_KEY_PASSWORD:-}" ]; then
            echo "::error::Stable signing secrets are required."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/ngocsi-ci.jks"
          printf "%s" "$NGOCSI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=$NGOCSI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=$NGOCSI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=$NGOCSI_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NGOCSI_SIGNING_MODE=stable" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Lint Debug
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          CI_KEYSTORE_PATH: ${{ env.CI_KEYSTORE_PATH }}
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: gradle :app:lintDebug --no-daemon
      - name: Unit tests
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          CI_KEYSTORE_PATH: ${{ env.CI_KEYSTORE_PATH }}
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build PRO APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          CI_KEYSTORE_PATH: ${{ env.CI_KEYSTORE_PATH }}
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Build signed Release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          CI_KEYSTORE_PATH: ${{ env.CI_KEYSTORE_PATH }}
          CI_KEYSTORE_PASSWORD: ${{ env.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ env.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ env.CI_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify signing mode
        run: |
          set -euo pipefail
          MODE="${NGOCSI_SIGNING_MODE:-debug-default}"
          echo "Signing mode: $MODE"
          if [ "$MODE" != "stable" ]; then
            echo "::error::Stable CI signing is not active."
            exit 1
          fi
          echo "Stable CI signing is active."
          echo "## Signing mode" >> "$GITHUB_STEP_SUMMARY"
          echo "- $MODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Debug and Release APKs
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -f "$APK"
            ls -lh "$APK"
            "$AAPT" dump badging "$APK" | grep -m1 -E "package: name='com.ngocsi.music'.*versionName='5.33'"
          done

      - name: Print APK signing certificate (OAuth diagnostic)
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          APK="$OUT/app-debug.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$OUT/signing-report.txt"
          SHA1="$(grep -E "certificate SHA-1 digest:" "$OUT/signing-report.txt" | head -n1 | sed 's/.*certificate SHA-1 digest:[[:space:]]*//' | tr -d '\r')"
          EXPECTED_SHA1="533fa19c58a40d926668f96296e7dbd34d696aed"
          echo "SHA-1: $SHA1"
          if [ "$SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Unexpected APK signing certificate."
            exit 1
          fi
          {
            echo "## Android OAuth diagnostic"
            echo ""
            echo "- Package: com.ngocsi.music"
            echo "- Actual APK SHA-1: $SHA1"
            echo "- Expected OAuth SHA-1: $EXPECTED_SHA1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print Release APK signing certificate
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$OUT/signing-report.txt"
          SHA1="$(grep -E "certificate SHA-1 digest:" "$OUT/signing-report.txt" | head -n1 | sed 's/.*certificate SHA-1 digest:[[:space:]]*//' | tr -d '\r')"
          EXPECTED_SHA1="533fa19c58a40d926668f96296e7dbd34d696aed"
          echo "Release SHA-1: $SHA1"
          if [ "$SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Unexpected Release APK signing certificate."
            exit 1
          fi
          {
            echo "## Release signing verification"
            echo ""
            echo "- Package: com.ngocsi.music"
            echo "- Release APK SHA-1: $SHA1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate APK SHA-256
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/app-release.apk.sha256
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: NGOC_SI_MUSIC_5.33_PRO_APKS
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/signing-report.txt
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/signing-report.txt
      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ngoc-si-music-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk.sha256 --title "NGỌC SĨ MUSIC 5.33 PRO — Latest APK" --notes "Recommended for everyday use: app-release.apk. Debug APK is included for diagnostics. Both variants are verified to use the stable NGOC SI MUSIC signing certificate."
