name: NGOC SI AI Firebase Preview APK (Debug Only)

on:
  # Build only the isolated debug preview. Lint and unit tests must pass before APK packaging.
  push:
    branches:
      - "feature/ngoc-si-ai-firebase-ai-logic-preview"
    paths:
      - ".github/workflows/ngoc-si-ai-firebase-preview-apk.yml"
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngoc-si-ai-firebase-preview-apk
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_DEBUG_APP_ID: ${{ secrets.FIREBASE_DEBUG_APP_ID }}

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Restore stable CI signing keystore
        shell: bash
        env:
          NGOCSI_KEYSTORE_BASE64: ${{ secrets.NGOCSI_KEYSTORE_BASE64 }}
          NGOCSI_KEYSTORE_PASSWORD: ${{ secrets.NGOCSI_KEYSTORE_PASSWORD }}
          NGOCSI_KEY_ALIAS: ${{ secrets.NGOCSI_KEY_ALIAS }}
          NGOCSI_KEY_PASSWORD: ${{ secrets.NGOCSI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NGOCSI_KEYSTORE_BASE64 NGOCSI_KEYSTORE_PASSWORD NGOCSI_KEY_ALIAS NGOCSI_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required stable signing secret is missing or empty: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/ngocsi-ai-preview.jks"
          printf "%s" "$NGOCSI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=$NGOCSI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=$NGOCSI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=$NGOCSI_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate Firebase preview configuration (values hidden)
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID FIREBASE_APP_ID FIREBASE_DEBUG_APP_ID; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Required GitHub Actions secret is missing or empty: $name"
              exit 1
            fi
          done
          [[ "$FIREBASE_PROJECT_ID" == "ngoc-si-music-ai" ]] || {
            echo "::error::FIREBASE_PROJECT_ID does not match the preview project."
            exit 1
          }
          [[ "$FIREBASE_SENDER_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::FIREBASE_SENDER_ID must be numeric."
            exit 1
          }
          for name in FIREBASE_APP_ID FIREBASE_DEBUG_APP_ID; do
            [[ "${!name}" =~ ^1:[0-9]+:android:.+$ ]] || {
              echo "::error::$name does not look like an Android Firebase App ID."
              exit 1
            }
          done
          echo "Firebase preview configuration format is valid."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Android lint
        run: gradle :app:lintDebug --no-daemon

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug preview APK only
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify package and version are isolated from production
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -m1 -E "package: name='com.ngocsi.music.aipreview' versionCode='69' versionName='5.49'"
          echo "Verified preview-only package: com.ngocsi.music.aipreview"

      - name: Verify APK signature and report App Check fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$RUNNER_TEMP/ngocsi-ai-preview-signing.txt"
          SHA1="$(grep -E "certificate SHA-1 digest:" "$RUNNER_TEMP/ngocsi-ai-preview-signing.txt" | head -n1 | sed 's/.*certificate SHA-1 digest:[[:space:]]*//' | tr -d '\r')"
          SHA256="$(grep -E "certificate SHA-256 digest:" "$RUNNER_TEMP/ngocsi-ai-preview-signing.txt" | head -n1 | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -d '\r')"
          test -n "$SHA1"
          test -n "$SHA256"
          {
            echo "## NGỌC SĨ AI preview APK"
            echo ""
            echo "- Package: com.ngocsi.music.aipreview"
            echo "- Version: 5.49"
            echo "- SHA-1: $SHA1"
            echo "- SHA-256: $SHA256"
            echo "- APK type: debug preview only; no release APK or production publishing."
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: NGOC_SI_AI_FIREBASE_PREVIEW_DEBUG_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
