name: NGOC SI AI Firebase Preview APK (Debug Only)

on:
  # Build only the isolated debug preview. Lint and unit tests must pass before APK packaging.
  push:
    branches:
      - "feature/ngoc-si-ai-firebase-ai-logic-preview"
      - "ngocsiAI"
    paths:
      - ".github/workflows/ngoc-si-ai-firebase-preview-apk.yml"
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngoc-si-ai-firebase-preview-apk-v5-youtube-autoplay
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_DEBUG_APP_ID: ${{ secrets.FIREBASE_DEBUG_APP_ID }}

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Restore stable CI signing keystore
        shell: bash
        env:
          NGOCSI_KEYSTORE_BASE64: ${{ secrets.NGOCSI_KEYSTORE_BASE64 }}
          NGOCSI_KEYSTORE_PASSWORD: ${{ secrets.NGOCSI_KEYSTORE_PASSWORD }}
          NGOCSI_KEY_ALIAS: ${{ secrets.NGOCSI_KEY_ALIAS }}
          NGOCSI_KEY_PASSWORD: ${{ secrets.NGOCSI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NGOCSI_KEYSTORE_BASE64 NGOCSI_KEYSTORE_PASSWORD NGOCSI_KEY_ALIAS NGOCSI_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required stable signing secret is missing or empty: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/ngocsi-ai-preview.jks"
          printf "%s" "$NGOCSI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=$NGOCSI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=$NGOCSI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=$NGOCSI_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate Firebase preview configuration (values hidden)
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID FIREBASE_APP_ID FIREBASE_DEBUG_APP_ID; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Required GitHub Actions secret is missing or empty: $name"
              exit 1
            fi
          done
          [[ "$FIREBASE_PROJECT_ID" == "ngoc-si-music-ai" ]] || {
            echo "::error::FIREBASE_PROJECT_ID does not match the preview project."
            exit 1
          }
          [[ "$FIREBASE_SENDER_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::FIREBASE_SENDER_ID must be numeric."
            exit 1
          }
          for name in FIREBASE_APP_ID FIREBASE_DEBUG_APP_ID; do
            [[ "${!name}" =~ ^1:[0-9]+:android:.+$ ]] || {
              echo "::error::$name does not look like an Android Firebase App ID."
              exit 1
            }
          done
          echo "Firebase preview configuration format is valid."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Prepare offline Vietnamese ASR runtime and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          AAR="app/libs/sherpa-onnx-1.13.8.aar"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar" \
            --output "$AAR"
          test "$(stat -c%s "$AAR")" -gt 40000000
          unzip -tq "$AAR"
          unzip -l "$AAR" | grep -F "jni/arm64-v8a/libsherpa-onnx-jni.so" >/dev/null
          ASR_MODEL_NAME="sherpa-onnx-zipformer-vi-30M-int8-2026-02-09"
          ASR_MODEL_DIR="app/src/main/assets/${ASR_MODEL_NAME}"
          mkdir -p "$ASR_MODEL_DIR"
          # Use the Hugging Face mirror for the four runtime assets required by the app.
          # The upstream GitHub release endpoint has intermittently returned HTTP 504.
          for MODEL_FILE in encoder.int8.onnx decoder.onnx joiner.int8.onnx tokens.txt; do
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 \
              "https://huggingface.co/csukuangfj2/${ASR_MODEL_NAME}/resolve/main/${MODEL_FILE}" \
              --output "$ASR_MODEL_DIR/$MODEL_FILE"
          done
          test "$(stat -c%s "$ASR_MODEL_DIR/encoder.int8.onnx")" -gt 20000000
          test "$(stat -c%s "$ASR_MODEL_DIR/decoder.onnx")" -gt 4000000
          test "$(stat -c%s "$ASR_MODEL_DIR/joiner.int8.onnx")" -gt 500000
          test "$(stat -c%s "$ASR_MODEL_DIR/tokens.txt")" -gt 10000
          echo "Prepared on-device Vietnamese ASR model."
          unzip -l "$AAR" | grep -F "classes.jar" >/dev/null
          echo "Prepared local Vietnamese ASR runtime and model; owner voice verification remains disabled in Preview."

      - name: Android lint
        run: gradle :app:lintDebug --no-daemon

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug preview APK only
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify native ELF and APK 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -print -quit)"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          python3 - "$APK" <<'PY'
          import pathlib
          import struct
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])
          checked = 0
          with zipfile.ZipFile(apk) as archive:
              native_libs = [name for name in archive.namelist()
                             if name.startswith("lib/") and name.endswith(".so")]
              if not native_libs:
                  raise SystemExit("No native shared libraries were found to verify.")
              for name in native_libs:
                  data = archive.read(name)
                  if len(data) < 64 or data[:4] != b"\x7fELF":
                      raise SystemExit(f"{name}: invalid ELF file")
                  if data[4] != 2 or data[5] != 1:
                      raise SystemExit(f"{name}: expected ELF64 little-endian Android library")
                  phoff = struct.unpack_from("<Q", data, 32)[0]
                  phentsize = struct.unpack_from("<H", data, 54)[0]
                  phnum = struct.unpack_from("<H", data, 56)[0]
                  if phentsize < 56 or phoff + phentsize * phnum > len(data):
                      raise SystemExit(f"{name}: invalid ELF program-header table")
                  loads = []
                  for index in range(phnum):
                      header = struct.unpack_from("<IIQQQQQQ", data, phoff + index * phentsize)
                      if header[0] == 1:  # PT_LOAD
                          loads.append(header[7])
                  if not loads:
                      raise SystemExit(f"{name}: no PT_LOAD segments")
                  if any(alignment < 16384 for alignment in loads):
                      raise SystemExit(
                          f"{name}: incompatible PT_LOAD alignment(s): {loads}"
                      )
                  print(f"16 KB ELF PASS: {name} ({len(loads)} LOAD segments)")
                  checked += 1
          print(f"Verified {checked} native libraries for 16 KB ELF alignment.")
          PY

      - name: Verify package and version are isolated from production
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          EXPECTED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts | head -n1)"
          EXPECTED_VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.ngocsi.music.aipreview'" <<< "$BADGING" >/dev/null
          grep -F "versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" <<< "$BADGING" >/dev/null
          echo "PREVIEW_VERSION_NAME=$EXPECTED_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Verified preview-only package: com.ngocsi.music.aipreview, version $EXPECTED_VERSION_NAME (code $EXPECTED_VERSION_CODE)"

      - name: Verify APK signature and report App Check fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$RUNNER_TEMP/ngocsi-ai-preview-signing.txt"
          SHA1="$(grep -E "certificate SHA-1 digest:" "$RUNNER_TEMP/ngocsi-ai-preview-signing.txt" | head -n1 | sed 's/.*certificate SHA-1 digest:[[:space:]]*//' | tr -d '\r')"
          SHA256="$(grep -E "certificate SHA-256 digest:" "$RUNNER_TEMP/ngocsi-ai-preview-signing.txt" | head -n1 | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -d '\r')"
          test -n "$SHA1"
          test -n "$SHA256"
          {
            echo "## NGỌC SĨ AI preview APK"
            echo ""
            echo "- Package: com.ngocsi.music.aipreview"
            echo "- Version: ${PREVIEW_VERSION_NAME}"
            echo "- SHA-1: $SHA1"
            echo "- SHA-256: $SHA256"
            echo "- APK type: debug preview only; no release APK or production publishing."
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: NGOC_SI_AI_FIREBASE_PREVIEW_DEBUG_APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
