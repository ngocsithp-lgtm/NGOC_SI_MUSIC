name: Deploy NGOC SI AI Free Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    if: github.ref == 'refs/heads/feature/ngoc-si-ai-android-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker/ngoc-si-ai-free-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."; exit 1; }
      - name: Test Worker code
        run: npm test
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.36.0 deploy
