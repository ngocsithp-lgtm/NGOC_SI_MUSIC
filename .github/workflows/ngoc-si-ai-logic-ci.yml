name: NGOC SI AI Logic Checks (No APK)

on:
  push:
    branches:
      - "feature/ngoc-si-ai-firebase-ai-logic-preview"
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/ngoc-si-ai-logic-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngoc-si-ai-logic-checks
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_DEBUG_APP_ID: ${{ secrets.FIREBASE_DEBUG_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Android lint (no APK packaging)
        run: gradle :app:lintDebug --no-daemon
      - name: Unit tests (no APK packaging)
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Guard against accidental APK packaging/publishing steps
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'assemble(Debug|Release)|bundle(Release|Debug)|upload-artifact|publish' .github/workflows/ngoc-si-ai-logic-ci.yml
          echo "Only lint/unit-test tasks are configured; this workflow does not package or publish an APK."
