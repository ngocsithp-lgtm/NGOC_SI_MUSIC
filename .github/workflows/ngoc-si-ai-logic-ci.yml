name: NGOC SI AI Logic Checks (No APK)

on:
  push:
    branches:
      - "feature/ngoc-si-ai-firebase-ai-logic-preview"
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/ngoc-si-ai-logic-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngoc-si-ai-logic-checks
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_DEBUG_APP_ID: ${{ secrets.FIREBASE_DEBUG_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Validate Firebase configuration (no secret values printed)
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID FIREBASE_APP_ID FIREBASE_DEBUG_APP_ID; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Required GitHub Actions secret is missing or empty: $name"
              exit 1
            fi
          done
          if [[ "$FIREBASE_PROJECT_ID" != "ngoc-si-music-ai" ]]; then
            echo "::error::FIREBASE_PROJECT_ID does not match the expected preview Firebase project."
            exit 1
          fi
          if [[ "$FIREBASE_SENDER_ID" != "482952354558" ]]; then
            echo "::error::FIREBASE_SENDER_ID does not match the expected Firebase project number."
            exit 1
          fi
          if [[ "$FIREBASE_APP_ID" != "1:482952354558:android:95a781f24913f05505e3af" ]]; then
            echo "::error::FIREBASE_APP_ID does not match the registered production Android app."
            exit 1
          fi
          if [[ "$FIREBASE_DEBUG_APP_ID" != "1:482952354558:android:d7cea500d97125d505e3af" ]]; then
            echo "::error::FIREBASE_DEBUG_APP_ID does not match the registered preview Android app."
            exit 1
          fi
          echo "Firebase project, production app, and preview app IDs match expected configuration (values hidden)."
      - name: Prepare offline Vietnamese ASR runtime and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar" \
            --output "app/libs/sherpa-onnx-1.13.8.aar"
          test "$(stat -c%s app/libs/sherpa-onnx-1.13.8.aar)" -gt 40000000
          unzip -tq app/libs/sherpa-onnx-1.13.8.aar
          unzip -l app/libs/sherpa-onnx-1.13.8.aar | grep -F "jni/arm64-v8a/libsherpa-onnx-jni.so" >/dev/null
          ASR_MODEL_NAME="sherpa-onnx-zipformer-vi-30M-int8-2026-02-09"
          ASR_ARCHIVE="$RUNNER_TEMP/${ASR_MODEL_NAME}.tar.bz2"
          ASR_MODEL_DIR="app/src/main/assets/${ASR_MODEL_NAME}"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${ASR_MODEL_NAME}.tar.bz2" \
            --output "$ASR_ARCHIVE"
          mkdir -p "$ASR_MODEL_DIR"
          tar -xjf "$ASR_ARCHIVE" -C "$RUNNER_TEMP" \
            "$ASR_MODEL_NAME/encoder.int8.onnx" \
            "$ASR_MODEL_NAME/decoder.onnx" \
            "$ASR_MODEL_NAME/joiner.int8.onnx" \
            "$ASR_MODEL_NAME/tokens.txt"
          cp "$RUNNER_TEMP/$ASR_MODEL_NAME/encoder.int8.onnx" "$ASR_MODEL_DIR/"
          cp "$RUNNER_TEMP/$ASR_MODEL_NAME/decoder.onnx" "$ASR_MODEL_DIR/"
          cp "$RUNNER_TEMP/$ASR_MODEL_NAME/joiner.int8.onnx" "$ASR_MODEL_DIR/"
          cp "$RUNNER_TEMP/$ASR_MODEL_NAME/tokens.txt" "$ASR_MODEL_DIR/"
          test "$(stat -c%s "$ASR_MODEL_DIR/encoder.int8.onnx")" -gt 20000000
          test "$(stat -c%s "$ASR_MODEL_DIR/decoder.onnx")" -gt 4000000
          test "$(stat -c%s "$ASR_MODEL_DIR/joiner.int8.onnx")" -gt 500000
          test "$(stat -c%s "$ASR_MODEL_DIR/tokens.txt")" -gt 10000
          echo "Prepared on-device Vietnamese ASR model; unused owner speaker-verification model omitted."
      - name: Android lint (no APK packaging)
        run: gradle :app:lintDebug --no-daemon
      - name: Unit tests (no APK packaging)
        run: gradle :app:testDebugUnitTest --no-daemon
