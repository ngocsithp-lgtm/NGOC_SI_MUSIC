name: Build YouTube Rotation Fix Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/youtube-player-reliability-preview
    paths:
      - "app/**"
      - ".github/workflows/youtube-player-reliability-preview.yml"

permissions:
  contents: read

concurrency:
  group: youtube-rotation-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build side-by-side YouTube Preview APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: gradle :app:assembleDebug -PyoutubePreview=true --no-daemon

      - name: Verify preview package identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -m1 -E "package: name='com.ngocsi.music.youtubepreview'.*versionName='5.38-youtube-preview'"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Preview APK
        uses: actions/upload-artifact@v6
        with:
          name: NGOC_SI_YOUTUBE_ROTATION_FIX_PREVIEW_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
