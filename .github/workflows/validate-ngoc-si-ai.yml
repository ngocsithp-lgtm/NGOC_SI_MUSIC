name: Validate NGOC SI AI (no APK)

on:
  push:
    branches:
      - feature/ngoc-si-ai-backend-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngoc-si-ai-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/ngoc-si-ai-backend-foundation

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Compile Kotlin without packaging an APK
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Run unit tests only
        run: gradle :app:testDebugUnitTest --no-daemon
