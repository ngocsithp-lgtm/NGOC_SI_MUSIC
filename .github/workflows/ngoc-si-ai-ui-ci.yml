name: NGOC SI AI UI Preview CI

on:
  pull_request:
    paths:
      - "app/src/main/**"
      - ".github/workflows/ngoc-si-ai-ui-ci.yml"
      - "docs/NGOC_SI_AI_UI_PREVIEW.md"
  push:
    branches:
      - "feature/ngoc-si-ai-ui-preview"
    paths:
      - "app/src/main/**"
      - ".github/workflows/ngoc-si-ai-ui-ci.yml"
      - "docs/NGOC_SI_AI_UI_PREVIEW.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK (no release/publish)
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify preview package is isolated from production
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | grep -m1 -E "package: name='com.ngocsi.music.aipreview'.*versionName='5.38'"
      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: NGOC_SI_AI_UI_PREVIEW_DEBUG_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
