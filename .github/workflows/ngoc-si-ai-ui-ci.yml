name: NGOC SI AI UI Preview CI

on:
  pull_request:
    paths:
      - "app/src/main/**"
      - ".github/workflows/ngoc-si-ai-ui-ci.yml"
      - "docs/NGOC_SI_AI_UI_PREVIEW.md"
  push:
    branches:
      - "feature/ngoc-si-ai-ui-preview"
    paths:
      - "app/src/main/**"
      - ".github/workflows/ngoc-si-ai-ui-ci.yml"
      - "docs/NGOC_SI_AI_UI_PREVIEW.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK (no release/publish)
        run: gradle :app:assembleDebug --no-daemon
