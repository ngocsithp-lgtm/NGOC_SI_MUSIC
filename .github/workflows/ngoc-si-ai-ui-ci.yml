name: NGOC SI AI Android Integration CI

# Push and pull_request can fire for the same commit; share a branch group to avoid duplicate Gradle builds.
concurrency:
  group: ngoc-si-ai-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "feature/ngoc-si-ai-complete-preview"
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/ngoc-si-ai-ui-ci.yml"
      - "docs/NGOC_SI_AI_UI_PREVIEW.md"
      - "docs/NGOC_SI_AI_ANDROID_INTEGRATION.md"
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
  pull_request:
    branches:
      - "main"
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/ngoc-si-ai-ui-ci.yml"
      - "docs/NGOC_SI_AI_ANDROID_INTEGRATION.md"
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_DEBUG_APP_ID: ${{ secrets.FIREBASE_DEBUG_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore stable CI signing keystore
        env:
          NGOCSI_KEYSTORE_BASE64: ${{ secrets.NGOCSI_KEYSTORE_BASE64 }}
          NGOCSI_KEYSTORE_PASSWORD: ${{ secrets.NGOCSI_KEYSTORE_PASSWORD }}
          NGOCSI_KEY_ALIAS: ${{ secrets.NGOCSI_KEY_ALIAS }}
          NGOCSI_KEY_PASSWORD: ${{ secrets.NGOCSI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NGOCSI_KEYSTORE_BASE64:-}" ] || [ -z "${NGOCSI_KEYSTORE_PASSWORD:-}" ] || [ -z "${NGOCSI_KEY_ALIAS:-}" ] || [ -z "${NGOCSI_KEY_PASSWORD:-}" ]; then
            echo "::error::Stable signing secrets are required for reproducible App Check fingerprints."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/ngocsi-ci.jks"
          printf "%s" "$NGOCSI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASSWORD=$NGOCSI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CI_KEY_ALIAS=$NGOCSI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CI_KEY_PASSWORD=$NGOCSI_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK (no release/publish)
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify preview package is isolated from production
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | grep -m1 -E "package: name='com.ngocsi.music.aipreview'.*versionName='5.41'"
      - name: Print stable preview signing SHA-256 for Firebase App Check
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$RUNNER_TEMP/ai-preview-signing.txt"
          SHA1="$(grep -E "certificate SHA-1 digest:" "$RUNNER_TEMP/ai-preview-signing.txt" | head -n1 | sed 's/.*certificate SHA-1 digest:[[:space:]]*//' | tr -d '\r')"
          SHA256="$(grep -E "certificate SHA-256 digest:" "$RUNNER_TEMP/ai-preview-signing.txt" | head -n1 | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -d '\r')"
          test -n "$SHA1"
          test -n "$SHA256"
          {
            echo "## OAuth and Firebase App Check — preview build"
            echo ""
            echo "- Android package: com.ngocsi.music.aipreview"
            echo "- Android OAuth SHA-1: $SHA1"
            echo "- Firebase App Check SHA-256: $SHA256"
            echo "- Register the package and SHA-1 in Google Cloud Android OAuth client for Drive."
            echo "- Register the package and SHA-256 in Firebase App Check before enabling online AI."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: NGOC_SI_AI_ANDROID_INTEGRATION_PREVIEW_DEBUG_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
